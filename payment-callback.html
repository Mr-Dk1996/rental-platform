<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifying Payment | RentHaven Ghana</title>
    <link rel="icon" type="image/png" href="images/renthaven-logo.png">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #f8fafc, #ecfeff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #0f172a;
        }

        .payment-card {
            width: min(92%, 520px);
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
            padding: 34px;
            text-align: center;
        }

        .payment-logo {
            width: 72px;
            height: 72px;
            object-fit: contain;
            margin-bottom: 18px;
        }

        .payment-icon {
            width: 76px;
            height: 76px;
            margin: 0 auto 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ccfbf1;
            color: #0f766e;
            font-size: 2.5rem;
        }

        .payment-icon.error {
            background: #fee2e2;
            color: #dc2626;
        }

        .payment-icon.loading i {
            animation: spin 1s linear infinite;
        }

        h1 {
            font-size: 1.7rem;
            margin: 0 0 10px;
        }

        p {
            color: #64748b;
            line-height: 1.6;
            margin: 0 0 18px;
        }

        .payment-proof {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 14px;
            padding: 14px;
            color: #334155;
            margin: 18px 0;
            text-align: left;
        }

        .payment-proof-row {
            display: grid;
            grid-template-columns: 130px minmax(0, 1fr);
            gap: 10px;
            padding: 7px 0;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.86rem;
        }

        .payment-proof-row:last-child {
            border-bottom: none;
        }

        .payment-proof-row span {
            color: #64748b;
        }

        .payment-proof-row strong,
        .payment-proof-row code {
            color: #0f172a;
            word-break: break-word;
        }

        .payment-proof-row code {
            font-size: 0.76rem;
        }

        .callback-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 22px;
        }

        .callback-actions a {
            text-decoration: none;
        }

        .callback-actions button {
            cursor: pointer;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 520px) {
            .payment-card {
                padding: 26px 20px;
            }

            .payment-proof-row {
                grid-template-columns: 1fr;
                gap: 3px;
            }
        }
    </style>
</head>
<body>
    <main class="payment-card">
        <img src="images/renthaven-logo.png" alt="RentHaven Ghana Logo" class="payment-logo">

        <div id="status-icon" class="payment-icon loading">
            <i class="ph ph-spinner"></i>
        </div>

        <h1 id="status-title">Verifying your payment</h1>
        <p id="status-message">
            Please wait while RentHaven Ghana confirms your payment and creates its hybrid blockchain-style ledger proof.
        </p>

        <div id="payment-proof" class="payment-proof" style="display: none;">
            <div class="payment-proof-row">
                <span>Payment reference</span>
                <strong id="payment-reference-value">Pending</strong>
            </div>
            <div class="payment-proof-row">
                <span>Ledger reference</span>
                <strong id="ledger-reference-value">Generating...</strong>
            </div>
            <div class="payment-proof-row">
                <span>Block</span>
                <strong id="ledger-block-value">Pending</strong>
            </div>
            <div class="payment-proof-row">
                <span>Hash proof</span>
                <code id="ledger-hash-value">Pending</code>
            </div>
        </div>

        <div class="callback-actions">
            <button
                type="button"
                class="btn-primary"
                id="download-payment-receipt-btn"
                style="display: none;"
            >
                <i class="ph ph-download-simple"></i>
                Download PDF Receipt
            </button>
            <button
                type="button"
                class="btn-outline"
                id="print-payment-receipt-btn"
                style="display: none;"
            >
                <i class="ph ph-printer"></i>
                Print Receipt
            </button>
            <a href="tenant-dashboard.html" class="btn-primary">Go to Dashboard</a>
            <a href="index.html" class="btn-outline">Back Home</a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/payment-receipt.js?v=receipt-v2"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const reference = params.get('reference');

        const statusIcon = document.getElementById('status-icon');
        const statusTitle = document.getElementById('status-title');
        const statusMessage = document.getElementById('status-message');
        const proofBox = document.getElementById('payment-proof');
        const paymentReferenceValue = document.getElementById('payment-reference-value');
        const ledgerReferenceValue = document.getElementById('ledger-reference-value');
        const ledgerBlockValue = document.getElementById('ledger-block-value');
        const ledgerHashValue = document.getElementById('ledger-hash-value');
        const downloadReceiptBtn = document.getElementById('download-payment-receipt-btn');
        const printReceiptBtn = document.getElementById('print-payment-receipt-btn');
        let verifiedReceiptData = null;

        function showPaymentReference() {
            if (!reference) return;

            proofBox.style.display = 'block';
            paymentReferenceValue.textContent = reference;
        }

        function showLedgerProof(result) {
            const proof = result?.ledger_proof || {};

            proofBox.style.display = 'block';
            ledgerReferenceValue.textContent =
                proof.ledger_reference ||
                result?.ledger_reference ||
                'Not available';
            ledgerBlockValue.textContent =
                proof.block_number != null
                    ? `#${proof.block_number} · ${proof.hash_algorithm || 'SHA-256'} · V${proof.ledger_version || 2}`
                    : 'Not available';
            ledgerHashValue.textContent = proof.current_hash || 'Not available';
        }

        function setSuccess(message) {
            statusIcon.className = 'payment-icon';
            statusIcon.innerHTML = '<i class="ph ph-check-circle"></i>';
            statusTitle.textContent = 'Payment verified successfully';
            statusMessage.textContent = message || 'Your rent payment has been confirmed and its Blockchain V2 ledger proof has been created.';
        }

        function setError(message) {
            statusIcon.className = 'payment-icon error';
            statusIcon.innerHTML = '<i class="ph ph-warning-circle"></i>';
            statusTitle.textContent = 'Payment verification failed';
            statusMessage.textContent = message || 'We could not verify the payment. Please check your dashboard or contact support.';
        }

        function prepareReceiptData(result) {
            const payment = result?.payment || {};
            const ledger = result?.ledger_proof || {};

            return result?.receipt_data || {
                amount: payment.amount,
                currency: payment.currency || 'GHS',
                payment_status: payment.payment_status || result?.status,
                payment_environment: payment.payment_environment,
                payment_reference: payment.payment_reference || reference,
                payment_channel: payment.payment_channel,
                paid_at: payment.paid_at || payment.created_at,
                property_title: String(payment.description || '')
                    .replace(/^Rent payment for\s+/i, '') || 'Rental Property',
                tenant_name: 'Tenant',
                landlord_name: 'Landlord',
                ledger_reference:
                    ledger.ledger_reference ||
                    result?.ledger_reference,
                block_number: ledger.block_number,
                current_hash: ledger.current_hash,
                hash_algorithm: ledger.hash_algorithm,
                ledger_version: ledger.ledger_version
            };
        }

        function enableReceiptActions(result) {
            verifiedReceiptData = prepareReceiptData(result);
            downloadReceiptBtn.style.display = 'inline-flex';
            printReceiptBtn.style.display = 'inline-flex';
        }

        downloadReceiptBtn.addEventListener('click', () => {
            if (!verifiedReceiptData || !window.RentHavenReceipt) return;

            try {
                window.RentHavenReceipt.download(verifiedReceiptData);
            } catch (error) {
                alert('Unable to download the receipt: ' + error.message);
            }
        });

        printReceiptBtn.addEventListener('click', () => {
            if (!verifiedReceiptData || !window.RentHavenReceipt) return;

            try {
                window.RentHavenReceipt.print(verifiedReceiptData);
            } catch (error) {
                alert('Unable to print the receipt: ' + error.message);
            }
        });

        async function getVerificationHeaders() {
            try {
                const {
                    data: { session }
                } = await supabaseClient.auth.getSession();

                if (session?.access_token) {
                    return {
                        Authorization: `Bearer ${session.access_token}`
                    };
                }
            } catch (error) {
                console.warn('Receipt identity details are unavailable:', error.message);
            }

            return {};
        }

        async function verifyPayment() {
            showPaymentReference();

            if (!reference) {
                setError('No payment reference was found in the payment callback URL.');
                return;
            }

            try {
                const headers = await getVerificationHeaders();
                const response = await fetch(
                    `/.netlify/functions/verify-payment?reference=${encodeURIComponent(reference)}`,
                    { headers }
                );
                const result = await response.json();

                if (!response.ok || result.status !== 'paid') {
                    setError(result.error || result.message || 'The payment was not successful.');
                    return;
                }

                showLedgerProof(result);
                enableReceiptActions(result);
                setSuccess('Your rent payment has been confirmed and a deterministic Blockchain V2 ledger reference has been generated.');
            } catch (error) {
                setError(error.message);
            }
        }

        verifyPayment();
    </script>
</body>
</html>
